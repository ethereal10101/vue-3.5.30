<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
     <script src="../../dist/vue.global.js"></script>
</head>
<body>
  <div id="app"></div>
</body>

<script>
  const {h,render} = Vue


  const component = {
    render() {
      const vnode1 = h('div','这是一个 component')
      console.log("vnode1",vnode1)
      return vnode1
    }
  }

  const vnode2 = h(component)
  console.log("vnode2",vnode2)
  render(vnode2, document.querySelector('#app'))

</script>
</html>
